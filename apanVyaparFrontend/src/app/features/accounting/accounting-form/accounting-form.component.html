<div class="accounting-form-container">
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">Add Transaction</h1>
      <p class="page-subtitle">Record a new income or expense</p>
    </div>
  </div>

  @if (error()) {
    <div class="error-message">{{ error() }}</div>
  }

  @if (success()) {
    <div class="success-message">{{ success() }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="accounting-form">
    <!-- Transaction Type -->
    <div class="form-group">
      <label>Transaction Type *</label>
      <div class="radio-group">
        <label class="radio-label" [class.selected]="transactionType() === 'INCOME'">
          <input type="radio" name="transactionType" value="INCOME" [checked]="transactionType() === 'INCOME'" (change)="transactionType.set('INCOME'); onTransactionTypeChange()">
          <span class="radio-icon">📈</span>
          <span>Income</span>
        </label>
        <label class="radio-label" [class.selected]="transactionType() === 'EXPENSE'">
          <input type="radio" name="transactionType" value="EXPENSE" [checked]="transactionType() === 'EXPENSE'" (change)="transactionType.set('EXPENSE'); onTransactionTypeChange()">
          <span class="radio-icon">📉</span>
          <span>Expense</span>
        </label>
      </div>
    </div>

    <!-- Category -->
    <div class="form-group">
      <label for="category">Category *</label>
      <select id="category" [(ngModel)]="category" name="category" required>
        <option value="">Select Category</option>
        @for (cat of currentCategories; track cat.value) {
          <option [value]="cat.value">{{ cat.label }}</option>
        }
      </select>
    </div>

    <!-- Amount -->
    <div class="form-group">
      <label for="amount">Amount (₹) *</label>
      <input type="number" id="amount" [(ngModel)]="amount" name="amount" min="0.01" step="0.01" placeholder="Enter amount" required>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" [(ngModel)]="description" name="description" rows="3" placeholder="Enter description (optional)"></textarea>
    </div>

    <!-- Payment Mode -->
    <div class="form-group">
      <label for="paymentMode">Payment Mode</label>
      <select id="paymentMode" [(ngModel)]="paymentMode" name="paymentMode">
        <option value="">Select Payment Mode</option>
        @for (mode of paymentModes; track mode.value) {
          <option [value]="mode.value">{{ mode.label }}</option>
        }
      </select>
    </div>

    <!-- Transaction Date -->
    <div class="form-group">
      <label for="transactionDate">Transaction Date</label>
      <input type="date" id="transactionDate" [(ngModel)]="transactionDate" name="transactionDate">
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" class="btn btn-outline" (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) {
          Processing...
        } @else {
          Save Transaction
        }
      </button>
    </div>
  </form>
</div>
