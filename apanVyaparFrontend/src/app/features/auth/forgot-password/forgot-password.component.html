<div class="forgot-container">
  <div class="forgot-box">
    <div class="forgot-header">
      <h1 class="logo">Apna Vyapar</h1>
      <p class="subtitle">Reset your password</p>
    </div>
    
    <div *ngIf="!emailSent()">
      <form class="forgot-form" (ngSubmit)="onSubmit()">
        <p class="info-text">Enter your email address and we'll send you a link to reset your password.</p>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>
        
        <div class="error-message" *ngIf="error()">
          {{ error() }}
        </div>
        
        <button type="submit" class="forgot-btn" [disabled]="isLoading()">
          <span *ngIf="!isLoading()">Send Reset Link</span>
          <span *ngIf="isLoading()">Sending...</span>
        </button>
      </form>
    </div>

    <div *ngIf="emailSent()" class="success-message">
      <div class="success-icon">✓</div>
      <h2>Email Sent!</h2>
      <p>We've sent a password reset link to <strong>{{ email }}</strong></p>
      <p class="resend-text">
        Didn't receive the email? 
        <button (click)="emailSent.set(false); email = ''" class="resend-btn">Resend</button>
      </p>
    </div>
    
    <div class="forgot-footer">
      <p><a routerLink="/login">← Back to Login</a></p>
    </div>
  </div>
</div>
